# A typical config: concrete hosts, wildcard defaults, an Include and Match.
Include ~/.ssh/config.d/*

Host *.corp
    User corp-admin
    ProxyJump bastion.corp

Host web1 web1-alias
    HostName 10.0.0.11
    Port 2222
    IdentityFile ~/.ssh/id_web

Host db.corp
    HostName %h.internal
    IdentityFile "~/.ssh/my keys/db key"

Host bastion.corp
    HostName 203.0.113.5
    User jump
    ProxyJump none

Match host *.example exec "true"
    User should-not-apply

Host *
    User fallback
    Port 22
    ServerAliveInterval 30
    ForwardAgent yes
    IdentityFile ~/.ssh/id_default
