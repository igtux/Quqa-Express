# Single package. Dependencies allowed to run install scripts; everything else
# is blocked. (Electron fetches its binary on first use, not at install.)
allowBuilds:
  esbuild: true
  # Optional native speed-ups for ssh2; it works in pure JavaScript without
  # them, which keeps compilers and native code out of the build.
  ssh2: false
  cpu-features: false
  # Squirrel.Windows installer helper; we build NSIS and portable targets only.
  electron-winstaller: false
  # Local terminals (ADR 0007): prebuilt N-API binaries for Windows, Linux and
  # macOS ship in the package, so its node-gyp fallback never runs.
  node-pty: false

# electron-builder packages a flat node_modules.
nodeLinker: hoisted

# pnpm audit: accepted findings, each with a reason (docs/adr/0002-vault.md, "Audit").
auditConfig:
  ignoreGhsas:
    # sprintf-js <=1.1.3 DoS through unbounded precision (no patched release).
    # Reached only through electron-builder > @electron/get > global-agent >
    # roarr, a build-time tool that formats its own log strings; never shipped.
    - GHSA-hp3w-g68c-fv3c
