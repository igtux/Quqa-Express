name: Release

# A tag such as v0.1.0 or v0.1.0-beta.1 builds the Windows installer and the
# portable exe on windows-latest, smoke-tests the packaged app, and publishes
# them with SHA256SUMS.txt as a GitHub release (a pre-release when the tag
# has a suffix such as -beta.1). Unsigned by design (docs/adr/0005). The
# release body starts with the tag's section of CHANGELOG.md, which the
# app's update panel shows (docs/adr/0006).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build and publish (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: The tag matches package.json and CHANGELOG.md has its notes
        shell: bash
        run: |
          node scripts/changelog.mjs "${GITHUB_REF_NAME}" > /dev/null
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            "v$version" | "v$version"-*) echo "Releasing $tag (package $version)" ;;
            *) echo "::error::Tag $tag does not match package.json version $version"; exit 1 ;;
          esac

      # Lint, typecheck and unit tests (the Docker SSH tests run in CI on Linux).
      - run: pnpm check
      - name: List every failed test
        if: failure()
        run: node scripts/ci-failures.mjs test-results/vitest.json

      - run: pnpm build
      - name: Package for the smoke test
        # bash: PowerShell would split "-c.electronFuses…=true" at the dot.
        shell: bash
        run: pnpm exec electron-builder --win dir --x64 -c.electronFuses.enableNodeCliInspectArguments=true -c.directories.output=release/smoke
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke test the packaged app
        run: pnpm test:smoke
        env:
          QUQA_APP_EXECUTABLE: ${{ github.workspace }}\release\smoke\win-unpacked\quqa-express.exe

      - name: Build the installer and the portable exe
        run: pnpm exec electron-builder --win nsis portable --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node scripts/checksums.mjs
      # The portable self-update helper for real (docs/adr/0006 addendum): it
      # waits for a running exe, swaps in a new one under the same name, keeps
      # updates/previous.exe, and rolls back; here also with the built exe.
      - name: Portable self-update swap test
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          export QUQA_TEST_PORTABLE_EXE="release/$version/quqa-express-$version-portable.exe"
          test -f "$QUQA_TEST_PORTABLE_EXE"
          pnpm exec vitest run test/windows

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          dir="release/$version"
          tag="${GITHUB_REF_NAME}"
          prerelease=""
          case "$tag" in *-*) prerelease="--prerelease" ;; esac
          {
            # What's new, from CHANGELOG.md (the in-app update panel shows this part).
            echo "## What's new in $tag"
            echo
            node scripts/changelog.mjs "$tag"
            echo
            echo "## Download"
            echo
            echo "quqa-express $tag for Windows 10 and 11 (x64)."
            echo
            echo "- \`quqa-express-$version-setup.exe\`: installer, for your user only (no administrator rights), with Start menu and desktop shortcuts. Uninstalling keeps your vault unless you ask for it to be removed."
            echo "- \`quqa-express-$version-portable.exe\`: no installation; keeps its data in a \`quqa-express-data\` folder next to the exe."
            echo
            echo "## Unsigned: Windows SmartScreen will warn"
            echo
            echo "These builds are not code-signed. On first start Windows shows \"Windows protected your PC\": click **More info**, then **Run anyway**. Check the download first:"
            echo
            echo '```powershell'
            echo "Get-FileHash .\\quqa-express-$version-setup.exe -Algorithm SHA256"
            echo '```'
            echo
            echo "The hash must match the line in \`SHA256SUMS.txt\`:"
            echo
            echo '```'
            cat "$dir/SHA256SUMS.txt"
            echo '```'
            echo
            echo "Built by GitHub Actions from commit ${GITHUB_SHA}."
          } > release-notes.md
          gh release create "$tag" \
            "$dir/quqa-express-$version-setup.exe" \
            "$dir/quqa-express-$version-portable.exe" \
            "$dir/SHA256SUMS.txt" \
            --title "quqa-express $tag" \
            --notes-file release-notes.md \
            --verify-tag $prerelease
