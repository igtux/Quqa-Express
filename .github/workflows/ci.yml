name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: pnpm check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The engine's end-to-end tests need an SSH server in Docker (Linux
      # runners only). Without QUQA_TEST_SSH_HOST they skip, as on Windows.
      - name: Start the test SSH server
        if: runner.os == 'Linux'
        run: |
          docker build -t quqa-express-test-sshd docker/test-sshd
          docker run -d --name test-sshd -p 2222:22 quqa-express-test-sshd
          {
            echo "QUQA_TEST_SSH_HOST=localhost"
            echo "QUQA_TEST_SSH_PORT=2222"
            echo "QUQA_TEST_SSH_USER=quqa"
            echo "QUQA_TEST_SSH_PASSWORD=quqa-test-password"
          } >> "$GITHUB_ENV"

      - run: pnpm check

      - name: List every failed test
        if: failure()
        run: node scripts/ci-failures.mjs test-results/vitest.json

      - name: Dependency audit (high and critical)
        if: runner.os == 'Linux'
        run: pnpm audit --audit-level high

      - name: UI tests (Playwright drives the built app)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:ui
      # Screenshots of every screen in both app themes (test/ui/look.spec.ts).
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: ui-screenshots-linux
          path: ui-screenshots/
          if-no-files-found: ignore
          retention-days: 14

  windows-build:
    name: Windows installer, portable build and smoke test
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Smoke test of the packaged app: same app.asar and fuses as the release,
      # except the inspect fuse, which Playwright needs to attach.
      - name: Package for the smoke test
        # bash: PowerShell would split "-c.electronFuses…=true" at the dot.
        shell: bash
        run: pnpm exec electron-builder --win dir --x64 -c.electronFuses.enableNodeCliInspectArguments=true -c.directories.output=release/smoke
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke test the packaged app
        run: pnpm test:smoke
        env:
          QUQA_APP_EXECUTABLE: ${{ github.workspace }}\release\smoke\win-unpacked\quqa-express.exe
      # Three PowerShell tabs at once: switching back must leave the first
      # one drawn intact (the shared WebGL glyph atlas, 0.1.0-beta.10).
      - name: Several local terminals in the packaged app
        run: pnpm exec playwright test test/ui/terminals.spec.ts
        env:
          QUQA_APP_EXECUTABLE: ${{ github.workspace }}\release\smoke\win-unpacked\quqa-express.exe
      # Georgian text as Windows draws it (smoke-georgian-*.png).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots-windows
          path: ui-screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build the installer and the portable exe
        run: pnpm exec electron-builder --win nsis portable --x64
        env:
          # Unsigned build: keep electron-builder from looking for a certificate.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node scripts/checksums.mjs
      # The portable self-update helper for real (docs/adr/0006 addendum): it
      # waits for a running exe, swaps in a new one under the same name, keeps
      # updates/previous.exe, and rolls back; here also with the built exe.
      - name: Portable self-update swap test
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          export QUQA_TEST_PORTABLE_EXE="release/$version/quqa-express-$version-portable.exe"
          test -f "$QUQA_TEST_PORTABLE_EXE"
          pnpm exec vitest run test/windows
      - uses: actions/upload-artifact@v4
        with:
          name: quqa-express-windows
          path: |
            release/*/*.exe
            release/*/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
