# Packaging (docs/adr/0005-packaging-and-release.md). Unsigned by design:
# Windows SmartScreen warns on first run ("More info" → "Run anyway").
appId: io.github.igtux.quqa-express
productName: quqa-express
copyright: Copyright © 2026 AURA and the quqa-express contributors
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**/*
  - package.json
  - '!**/*.map'
  # node-pty (local terminals, ADR 0007): only its JavaScript, its licence and
  # the prebuilt N-API binaries run; sources, debug symbols and arm64 builds
  # stay out. Each platform below drops the other platforms' binaries.
  - '!node_modules/node-pty/{src,deps,third_party,scripts,typings}/**'
  - '!node_modules/node-pty/binding.gyp'
  - '!node_modules/node-pty/prebuilds/**/*.pdb'
  - '!node_modules/node-pty/prebuilds/*-arm64/**'
  - '!node_modules/node-addon-api/**'
asar: true
# Licences of the bundled fonts (THIRD_PARTY_NOTICES.md) next to app.asar.
extraResources:
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: LICENSE
    to: LICENSE
  - from: licenses
    to: licenses
# ssh2 talks to Pageant through this helper program; programs cannot start
# from inside app.asar (the engine points spawn at the unpacked copy).
asarUnpack:
  - node_modules/ssh2/util/pagent.exe
  # node-pty loads native modules, starts a worker thread and (Windows) runs
  # OpenConsole.exe next to itself: all real files (src/pty/node-pty.ts).
  - node_modules/node-pty/**
# ssh2's optional native add-ons are not built; it runs in pure JavaScript.
# node-pty ships prebuilt N-API binaries (one build for every Electron), so
# nothing is compiled or rebuilt, natively or in the Wine cross-build.
npmRebuild: false
nodeGypRebuild: false
extraMetadata:
  main: out/main/index.js
publish: null
# Electron fuses (flipped in the packaged binary). The page loads from our own
# app:// protocol, so file:// keeps no extra privileges.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
win:
  icon: build/icon.ico
  files:
    - '!node_modules/node-pty/prebuilds/{darwin,linux}-*/**'
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  # No code signing; the version resource and icon are still written.
  signAndEditExecutable: true
  forceCodeSigning: false
  artifactName: ${name}-${version}-${arch}.${ext}
nsis:
  # Per-user install into %LOCALAPPDATA%\Programs: no administrator rights.
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: quqa-express
  uninstallDisplayName: quqa-express
  # The vault stays unless the user says yes in the uninstaller (installer.nsh).
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: ${name}-${version}-setup.${ext}
portable:
  # Keeps its profile in "quqa-express-data" next to the .exe (src/main/index.ts).
  artifactName: ${name}-${version}-portable.${ext}
linux:
  files:
    - '!node_modules/node-pty/prebuilds/{darwin,win32}-*/**'
  target: [AppImage]
  category: System
mac:
  files:
    - '!node_modules/node-pty/prebuilds/{linux,win32}-*/**'
  target: [dmg]
  category: public.app-category.developer-tools
  identity: null
