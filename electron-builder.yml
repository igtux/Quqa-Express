# Packaging (docs/adr/0005-packaging-and-release.md). Unsigned by design:
# Windows SmartScreen warns on first run ("More info" → "Run anyway").
appId: io.github.igtux.quqa-express
productName: quqa-express
copyright: Copyright © 2026 AURA and the quqa-express contributors
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**/*
  - package.json
  - '!**/*.map'
asar: true
# ssh2 talks to Pageant through this helper program; programs cannot start
# from inside app.asar (the engine points spawn at the unpacked copy).
asarUnpack:
  - node_modules/ssh2/util/pagent.exe
# ssh2's optional native add-ons are not built; it runs in pure JavaScript.
npmRebuild: false
nodeGypRebuild: false
extraMetadata:
  main: out/main/index.js
publish: null
# Electron fuses (flipped in the packaged binary). The page loads from our own
# app:// protocol, so file:// keeps no extra privileges.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  # No code signing; the version resource and icon are still written.
  signAndEditExecutable: true
  forceCodeSigning: false
  artifactName: ${name}-${version}-${arch}.${ext}
nsis:
  # Per-user install into %LOCALAPPDATA%\Programs: no administrator rights.
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: quqa-express
  uninstallDisplayName: quqa-express
  # The vault stays unless the user says yes in the uninstaller (installer.nsh).
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: ${name}-${version}-setup.${ext}
portable:
  # Keeps its profile in "quqa-express-data" next to the .exe (src/main/index.ts).
  artifactName: ${name}-${version}-portable.${ext}
linux:
  target: [AppImage]
  category: System
mac:
  target: [dmg]
  category: public.app-category.developer-tools
  identity: null
